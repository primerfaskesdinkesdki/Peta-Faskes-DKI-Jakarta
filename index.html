<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Peta Faskes DKI Jakarta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
    .legend {
      background: white;
      padding: 10px;
      font-size: 12px;
      line-height: 18px;
    }
    .legend i {
      width: 12px;
      height: 12px;
      float: left;
      margin-right: 6px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
  const csvUrl =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTf9sVvdxLpwwdxiJGtOCHgY2lJjDZyvjgNDKEu0J1q5gyjDu6Z6owVNYq44Y0VBAAFZYVlvQ2BtA--/pub?output=csv";

  const warnaFaskes = {
    "Klinik Pratama": "#35824f",
    "Klinik Utama": "#9edb75",
    "TPMD": "#427eb4",
    "TPMDG": "#5fc3f4",
    "Praktik Mandiri Bidan": "#8973b2",
    "Praktik Mandiri Perawat": "#dd9331",
    "Griya Sehat": "#eb748d"
  };

  const map = L.map("map").setView([-6.2, 106.8], 11);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
  }).addTo(map);

  Papa.parse(csvUrl, {
    download: true,
    header: true,
    complete: function (results) {
      results.data.forEach(row => {
        const lat = parseFloat(row["Lattitude"]);
        const lng = parseFloat(row["Longitude"]);

        if (isNaN(lat) || isNaN(lng)) return;

        const jenis = row["Jenis Faskes"];
        const warna = warnaFaskes[jenis] || "#000000";

        const marker = L.circleMarker([lat, lng], {
          radius: 6,
          fillColor: warna,
          color: warna,
          weight: 1,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        const gmapsLink = `https://www.google.com/maps?q=${lat},${lng}`;

        marker.bindPopup(`
          <b>${row["Nama Faskes"]}</b><br>
          ${jenis}<br>
          ${row["Alamat"]}<br><br>
          <a href="${gmapsLink}" target="_blank">📍 Buka di Google Maps</a>
        `);
      });
    }
  });

  // Legend
  const legend = L.control({ position: "bottomright" });
  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "legend");
    div.innerHTML = "<b>Jenis Faskes</b><br>";
    for (const key in warnaFaskes) {
      div.innerHTML +=
        `<i style="background:${warnaFaskes[key]}"></i>${key}<br>`;
    }
    return div;
  };
  legend.addTo(map);
</script>

</body>
</html>
