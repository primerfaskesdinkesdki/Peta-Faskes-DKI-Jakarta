<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Peta Fasilitas Pelayanan Kesehatan DKI Jakarta</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PapaParse (CSV reader) -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    .legend {
      background: white;
      padding: 10px;
      line-height: 18px;
      color: #333;
      box-shadow: 0 0 6px rgba(0,0,0,0.2);
      border-radius: 6px;
    }
    .legend i {
      width: 12px;
      height: 12px;
      float: left;
      margin-right: 8px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // Inisialisasi map (DKI Jakarta)
  const map = L.map('map').setView([-6.2, 106.8], 11);

  // Base map OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Warna per jenis faskes (SESUAI PERMINTAAN)
  const colors = {
    "Klinik Pratama": "#35824f",
    "Klinik Utama": "#9edb75",
    "TPMD": "#427eb4",
    "TPMDG": "#5fc3f4",
    "Praktik Mandiri Bidan": "#8973b2",
    "Praktik Mandiri Perawat": "#dd9331",
    "Griya Sehat": "#eb748d"
  };

  // GANTI dengan link CSV Google Sheets kamu
  const CSV_URL = "https://docs.google.com/spreadsheets/d/1PpLq4xG-HvnPsqGN11ScjprAbXWw8JxsfCx2FCs3108/edit?gid=0#gid=0";

  // Load data dari Google Sheets
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (results) {
      results.data.forEach(row => {
        const lat = parseFloat(row.Latitude);
        const lng = parseFloat(row.Longitude);
        const jenis = row["Jenis Faskes"];
        const nama = row["Nama Faskes"] || "Faskes";

        if (!isNaN(lat) && !isNaN(lng)) {
          L.circleMarker([lat, lng], {
            radius: 6,
            stroke: false,
            fillColor: colors[jenis] || "#000000",
            fillOpacity: 0.85
          })
          .bindPopup(`
            <b>${nama}</b><br>
            ${jenis}<br><br>
            <a href="https://www.google.com/maps?q=${lat},${lng}"
               target="_blank">
               📍 Buka di Google Maps
            </a>
          `)
          .addTo(map);
        }
      });
    }
  });

  // Legend
  const legend = L.control({ position: 'bottomright' });

  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>Jenis Faskes</b><br>';
    for (const key in colors) {
      div.innerHTML +=
        `<i style="background:${colors[key]}"></i>${key}<br>`;
    }
    return div;
  };

  legend.addTo(map);
</script>

</body>
</html>
